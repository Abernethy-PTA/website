name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC (~7:17am PT): catch link rot between pushes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check every link in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --cache --max-cache-age 1d
            --root-dir "${{ github.workspace }}/_site"
            "_site/**/*.html"
          fail: true
          failIfEmpty: true
          jobSummary: true
